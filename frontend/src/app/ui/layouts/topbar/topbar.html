<header class="topbar">
  <!-- Mobile hamburger -->
  <button
    class="topbar__hamburger"
    (click)="layout.toggleMobileSidebar()"
    aria-label="Toggle navigation"
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
  </button>

  <!-- Page title -->
  <h1 class="topbar__title">{{ layout.pageTitle() }}</h1>

  <div class="topbar__spacer"></div>

  <!-- User avatar -->
  <div class="topbar__avatar" title="Marc Lorenzo">ML</div>
</header>
