<header class="topbar">
  <!-- Mobile hamburger -->
  <button
    class="topbar__hamburger"
    (click)="layout.toggleMobileSidebar()"
    aria-label="Toggle navigation"
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
  </button>

  <!-- Page title -->
  <h1 class="topbar__title">{{ layout.pageTitle() }}</h1>

  <div class="topbar__spacer"></div>

  <!-- Theme toggle -->
  <button
    class="topbar__theme-toggle"
    (click)="theme.toggle()"
    [title]="theme.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'"
    aria-label="Cambiar tema"
  >
    @if (theme.theme() === "dark") {
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
    } @else {
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    }
  </button>

  <!-- Logout button -->
  <button
    class="topbar__logout"
    (click)="logout()"
    title="Cerrar sesión"
    aria-label="Cerrar sesión"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <polyline points="16 17 21 12 16 7" />
      <line x1="21" y1="12" x2="9" y2="12" />
    </svg>
    <span>Salir</span>
  </button>

  <!-- User avatar — navigates to /profile -->
  <button
    class="topbar__avatar"
    [title]="user()?.name ?? ''"
    (click)="navigateToProfile()"
    aria-label="Ver perfil"
  >
    @if (user()?.imageUrl) {
      <img
        class="topbar__avatar-img"
        [ngSrc]="imageBaseUrl + user()!.imageUrl + '?v=' + auth.imageVersion()"
        width="32"
        height="32"
        [alt]="user()!.name"
      />
    } @else {
      {{ initials() }}
    }
  </button>
</header>
