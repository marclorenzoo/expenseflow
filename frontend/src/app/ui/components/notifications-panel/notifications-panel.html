<!-- Bell button + unread badge -->
<button
  class="bell"
  type="button"
  (click)="toggle()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-expanded]="open()"
  aria-haspopup="true"
>
  <svg
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
  </svg>

  @if (unreadCount() > 0) {
    <span class="bell__badge" aria-hidden="true">{{ badgeLabel() }}</span>
  }
</button>

<!-- Dropdown -->
@if (open()) {
  <div
    class="dropdown ef-pop-in"
    style="transform-origin: top right"
    role="menu"
    aria-label="Notificaciones"
  >
    <div class="dropdown__header">
      <span class="dropdown__title">Notificaciones</span>
      <div class="dropdown__actions">
        @if (unreadCount() > 0) {
          <button
            class="dropdown__mark-all"
            type="button"
            (click)="markAllAsRead()"
          >
            Marcar todas como leídas
          </button>
        }
        @if (notifications().length > 0) {
          <button
            class="dropdown__clear-all"
            type="button"
            aria-label="Limpiar todas las notificaciones"
            (click)="clearAll()"
          >
            Limpiar todas
          </button>
        }
      </div>
    </div>

    <div class="dropdown__list">
      @for (n of notifications(); track n.id) {
        <button
          class="notif"
          type="button"
          role="menuitem"
          [class.notif--unread]="!n.read"
          [class.notif--clickable]="
            n.type !== 'GROUP_DELETED' && n.data?.groupId
          "
          (click)="onNotificationClick(n)"
        >
          @if (!n.read) {
            <span class="notif__dot" aria-hidden="true"></span>
          }

          <span class="notif__icon notif__icon--{{ n.type.toLowerCase() }}">
            @switch (n.type) {
              @case ("EXPENSE_CREATED") {
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="8" cy="8" r="6" />
                  <path d="M18.09 10.37A6 6 0 1 1 10.34 18" />
                  <path d="M7 6h1v4" />
                  <path d="m16.71 13.88.7.71-2.82 2.82" />
                </svg>
              }
              @case ("MEMBER_ADDED") {
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <line x1="19" y1="8" x2="19" y2="14" />
                  <line x1="22" y1="11" x2="16" y2="11" />
                </svg>
              }
              @case ("GROUP_DELETED") {
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="3 6 5 6 21 6" />
                  <path
                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                  />
                  <line x1="10" y1="11" x2="10" y2="17" />
                  <line x1="14" y1="11" x2="14" y2="17" />
                </svg>
              }
            }
          </span>

          <span class="notif__body">
            <span class="notif__title">{{ n.title }}</span>
            <span class="notif__message">{{ n.message }}</span>
            <span class="notif__time">{{ relativeTime(n.createdAt) }}</span>
          </span>
        </button>
      } @empty {
        <div class="notif-empty">Estás al día. No tienes notificaciones.</div>
      }
    </div>
  </div>
}
