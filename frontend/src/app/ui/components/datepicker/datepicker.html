<div class="dp-wrapper">
  @if (label()) {
    <label class="dp-label">{{ label() }}</label>
  }

  <button
    type="button"
    class="dp-trigger"
    [class.dp-trigger--open]="isOpen()"
    (click)="toggle()"
  >
    <span [class.dp-trigger__placeholder]="!displayValue()">
      {{ displayValue() || "Seleccionar fecha" }}
    </span>
    <svg
      class="dp-trigger__icon"
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
      <line x1="16" y1="2" x2="16" y2="6" />
      <line x1="8" y1="2" x2="8" y2="6" />
      <line x1="3" y1="10" x2="21" y2="10" />
    </svg>
  </button>

  @if (isOpen()) {
    <div class="dp-calendar">
      <div class="dp-calendar__header">
        <button type="button" class="dp-calendar__nav" (click)="prevMonth()">
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>
        <span class="dp-calendar__month-label">{{ monthLabel() }}</span>
        <button type="button" class="dp-calendar__nav" (click)="nextMonth()">
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>
      </div>

      <div class="dp-calendar__grid">
        @for (wd of WEEKDAYS; track wd) {
          <span class="dp-calendar__weekday">{{ wd }}</span>
        }

        @for (day of calendarDays(); track $index) {
          @if (day.date) {
            <button
              type="button"
              class="dp-calendar__day"
              [class.dp-calendar__day--today]="isToday(day.date)"
              [class.dp-calendar__day--selected]="isSelected(day.date)"
              (click)="selectDay(day.date)"
            >
              {{ day.date.getDate() }}
            </button>
          } @else {
            <span class="dp-calendar__day dp-calendar__day--empty"></span>
          }
        }
      </div>
    </div>
  }
</div>
