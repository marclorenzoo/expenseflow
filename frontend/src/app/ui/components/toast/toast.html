<div
  class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"
>
  @for (toast of toasts(); track toast.id) {
    <div [class]="classes(toast.type)">
      <span
        class="flex-shrink-0 w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold leading-none"
      >
        {{ icon(toast.type) }}
      </span>
      <span class="flex-1 leading-snug">{{ toast.message }}</span>
    </div>
  }
</div>
