<div class="flex flex-col items-center gap-4 py-14 px-6 text-center">
  <div
    class="w-[60px] h-[60px] rounded-full bg-red-50 dark:bg-red-900/20 text-error-500 dark:text-red-400 flex items-center justify-center flex-shrink-0"
  >
    <svg
      width="26"
      height="26"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
      />
      <line x1="12" y1="9" x2="12" y2="13" />
      <line x1="12" y1="17" x2="12.01" y2="17" />
    </svg>
  </div>

  <div class="flex flex-col gap-1.5 items-center">
    <h3
      class="text-base font-semibold text-neutral-800 dark:text-neutral-200 tracking-tight"
    >
      {{ title() }}
    </h3>
    @if (message()) {
      <p
        class="text-sm text-neutral-500 dark:text-neutral-400 max-w-[280px] leading-relaxed"
      >
        {{ message() }}
      </p>
    }
  </div>

  <ef-button variant="secondary" size="sm" (click)="onRetry.emit()">
    <svg
      width="13"
      height="13"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="1 4 1 10 7 10" />
      <path d="M3.51 15a9 9 0 1 0 .49-4.95" />
    </svg>
    Reintentar
  </ef-button>
</div>
