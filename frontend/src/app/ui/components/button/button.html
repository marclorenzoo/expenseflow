<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [class]="buttonClasses()"
  [attr.data-testid]="testId() || null"
>
  @if (loading()) {
    <span
      class="animate-spin inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full"
    ></span>
  }
  <ng-content />
</button>
