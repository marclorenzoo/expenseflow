<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label class="text-sm font-medium text-neutral-700 dark:text-neutral-300">
      {{ label() }}
    </label>
  }

  <input
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [(ngModel)]="value"
    [class]="inputClasses()"
    [attr.data-testid]="testId() || null"
    (blur)="blur.emit()"
  />

  @if (error()) {
    <span class="text-sm text-error-500">{{ error() }}</span>
  }
</div>
