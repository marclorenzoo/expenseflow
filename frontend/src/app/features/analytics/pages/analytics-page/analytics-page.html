<div class="p-8 flex flex-col gap-6">
  <!-- Header -->
  <div>
    <h1 class="text-2xl font-semibold text-neutral-900">Analytics</h1>
    <p class="text-sm text-neutral-500 mt-1">Resumen de gastos del año 2024</p>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <ef-card>
      <p class="text-xs font-medium text-neutral-500 uppercase tracking-wide">
        Total anual
      </p>
      <p class="text-2xl font-bold text-neutral-900 mt-2">
        {{ total | number: "1.0-0" }} €
      </p>
    </ef-card>
    <ef-card>
      <p class="text-xs font-medium text-neutral-500 uppercase tracking-wide">
        Promedio mensual
      </p>
      <p class="text-2xl font-bold text-neutral-900 mt-2">
        {{ average | number: "1.0-0" }} €
      </p>
    </ef-card>
    <ef-card>
      <p class="text-xs font-medium text-neutral-500 uppercase tracking-wide">
        Mes más alto
      </p>
      <p class="text-2xl font-bold text-neutral-900 mt-2">
        {{ maxValue | number: "1.0-0" }} €
        <span class="text-sm font-normal text-neutral-400 ml-1">{{
          maxMonth
        }}</span>
      </p>
    </ef-card>
  </div>

  <!-- Chart card -->
  <ef-card [padding]="'none'">
    <div
      class="flex items-center justify-between px-6 py-5 border-b border-neutral-100"
    >
      <div>
        <h2 class="text-base font-semibold text-neutral-900">
          Gastos mensuales
        </h2>
        <p class="text-xs text-neutral-400 mt-0.5">Enero – Diciembre 2024</p>
      </div>
      <span
        class="inline-flex items-center gap-1.5 text-xs font-medium text-primary-600 bg-primary-50 px-2.5 py-1 rounded-full"
      >
        <span class="size-1.5 rounded-full bg-primary-500"></span>
        Gastos
      </span>
    </div>
    <div class="px-2 py-4">
      <ef-chart
        [series]="series"
        [colors]="colors"
        [chart]="chartConfig"
        [xaxis]="xaxis"
        [yaxis]="yaxis"
        [stroke]="stroke"
        [fill]="fill"
        [grid]="grid"
        [tooltip]="tooltip"
        [dataLabels]="dataLabels"
      />
    </div>
  </ef-card>
</div>
