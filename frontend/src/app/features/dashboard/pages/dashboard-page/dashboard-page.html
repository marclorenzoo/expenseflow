<div class="p-8 flex flex-col gap-6">
  <ef-card>
    <h1 class="text-xl font-semibold text-neutral-900 dark:text-neutral-100">
      Sistema de diseño
    </h1>
    <p class="text-neutral-500 dark:text-neutral-400 mt-1">
      Componentes base de ExpenseFlow
    </p>
  </ef-card>

  <ef-card>
    <div class="flex gap-3 flex-wrap">
      <ef-button>Primario</ef-button>
      <ef-button variant="secondary">Secundario</ef-button>
      <ef-button variant="ghost">Fantasma</ef-button>
      <ef-button variant="danger">Peligro</ef-button>
      <ef-button [loading]="true">Cargando</ef-button>
      <ef-button [disabled]="true">Deshabilitado</ef-button>
    </div>
  </ef-card>

  <ef-card>
    <div class="flex flex-col gap-4 max-w-sm">
      <ef-input label="Correo" placeholder="tu@email.com" type="email" />
      <ef-input label="Contraseña" placeholder="••••••••" type="password" />
      <ef-input
        label="Con error"
        placeholder="Escribe algo"
        error="Este campo es obligatorio"
      />
    </div>
  </ef-card>
</div>
