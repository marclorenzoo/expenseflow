<div class="auth-wrapper">
  <div class="auth-container">
    <!-- Brand -->
    <div class="flex flex-col items-center gap-3 mb-8">
      <div class="logo-mark">
        <svg
          width="44"
          height="44"
          viewBox="0 0 44 44"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <rect width="44" height="44" rx="12" fill="#4f46e5" />
          <path
            d="M19 30V14M19 14L15 18M19 14L23 18"
            stroke="white"
            stroke-width="2.25"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M25 14v16m0 0l-4-4m4 4l4-4"
            stroke="rgba(255,255,255,0.48)"
            stroke-width="2.25"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div class="text-center">
        <p class="brand-name">ExpenseFlow</p>
        <p class="text-sm text-neutral-500 mt-1">
          Create your account and start tracking
        </p>
      </div>
    </div>

    <!-- Card -->
    <div class="auth-card">
      <div class="flex flex-col gap-5">
        <div class="flex flex-col gap-1.5">
          <label for="name" class="text-sm font-medium text-neutral-700">
            Full name
          </label>
          <input
            (input)="name.set($event.target.value)"
            id="name"
            type="text"
            placeholder="Alex Mercer"
            autocomplete="name"
            class="w-full bg-neutral-50 border border-neutral-200 rounded-xl !px-4 !py-3 text-sm text-neutral-900 placeholder:text-neutral-400 outline-none transition-colors duration-150 focus:bg-white focus:border-primary-500 focus:ring-2 focus:ring-primary-200"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-sm font-medium text-neutral-700">
            Email address
          </label>
          <input
            (input)="email.set($event.target.value)"
            id="email"
            type="email"
            placeholder="you@company.com"
            autocomplete="email"
            class="w-full bg-neutral-50 border border-neutral-200 rounded-xl !px-4 !py-3 text-sm text-neutral-900 placeholder:text-neutral-400 outline-none transition-colors duration-150 focus:bg-white focus:border-primary-500 focus:ring-2 focus:ring-primary-200"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="password" class="text-sm font-medium text-neutral-700">
            Password
          </label>
          <input
            (input)="password.set($event.target.value)"
            id="password"
            type="password"
            placeholder="Create a strong password"
            autocomplete="new-password"
            class="w-full bg-neutral-50 border border-neutral-200 rounded-xl !px-4 !py-3 text-sm text-neutral-900 placeholder:text-neutral-400 outline-none transition-colors duration-150 focus:bg-white focus:border-primary-500 focus:ring-2 focus:ring-primary-200"
          />
        </div>

        <button
          (click)="onRegister()"
          type="submit"
          class="w-full bg-primary-600 hover:bg-primary-700 active:bg-primary-800 active:scale-[0.99] text-white text-sm font-semibold rounded-xl !py-3 px-4 mt-1 transition-all duration-150 cursor-pointer"
        >
          Create account
        </button>
      </div>
    </div>

    <!-- Footer -->
    <p class="auth-footer-text">
      Already have an account?
      <a routerLink="/auth/login" class="auth-link">Sign in</a>
    </p>
  </div>
</div>
