<!-- Shared frame: card -->
<div class="card">
  <p class="subtitle">Bienvenido de nuevo. Inicia sesión para continuar.</p>

  <form (submit)="$event.preventDefault(); onSubmit()" novalidate>
    <div class="field">
      <label for="login-email">Correo electrónico</label>
      <div class="input-wrap">
        <input
          (input)="email.set($event.target.value)"
          id="login-email"
          data-testid="login-email"
          type="email"
          name="email"
          placeholder="tu@email.com"
          autocomplete="email"
        />
        <span class="ic" aria-hidden="true">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="14" rx="2.5" />
            <path d="M3.5 7l8.5 6 8.5-6" />
          </svg>
        </span>
      </div>
    </div>

    <div class="field">
      <label for="login-password">Contraseña</label>
      <div class="input-wrap">
        <input
          (input)="password.set($event.target.value)"
          id="login-password"
          data-testid="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <span class="ic" aria-hidden="true">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="4" y="10.5" width="16" height="10" rx="2.4" />
            <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" />
          </svg>
        </span>
        <button
          type="button"
          class="pw-toggle"
          [class.show]="showPassword()"
          [attr.aria-label]="
            showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'
          "
          (click)="togglePassword()"
        >
          <svg
            class="eye"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg
            class="eye-off"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M3 3l18 18M10.6 6.2A9.9 9.9 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3 3.6M6.3 7.8A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4-.85"
            />
            <path d="M9.5 10.5a3 3 0 0 0 4.2 4.2" />
          </svg>
        </button>
      </div>
    </div>

    <button
      type="submit"
      class="btn-primary"
      data-testid="login-submit"
      [disabled]="loading()"
    >
      {{ loading() ? "Iniciando sesión…" : "Iniciar sesión" }}
    </button>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }
  </form>
</div>

<!-- Shared frame: switch link -->
<p class="switch">
  ¿Aún no tienes cuenta?
  <a routerLink="/auth/register">Créala gratis</a>
</p>
