<main class="auth-main">
  <!-- Frame-level: back to landing -->
  <a routerLink="/" class="back-home">
    <svg
      width="17"
      height="17"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M15 18l-6-6 6-6" />
    </svg>
    Home
  </a>

  <!-- Frame-level: dark/light toggle -->
  <button
    type="button"
    class="theme-toggle"
    (click)="theme.toggle()"
    [attr.aria-label]="
      theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
    "
  >
    <svg
      class="sun"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    >
      <circle cx="12" cy="12" r="4.2" />
      <path
        d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"
      />
    </svg>
    <svg
      class="moon"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20.5 14.3A8.2 8.2 0 0 1 9.7 3.5 8.2 8.2 0 1 0 20.5 14.3z" />
    </svg>
  </button>

  <div class="auth">
    <!-- Shared frame: brand -->
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
          <path
            d="M8 3v14m0 0l-3.2-3.4M8 17l3.2-3.4"
            stroke="#fff"
            stroke-width="2.1"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M16 21V7m0 0l3.2 3.4M16 7l-3.2 3.4"
            stroke="#fff"
            stroke-width="2.1"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="name">ExpenseFlow</span>
    </div>

    <!-- Shared frame: card -->
    <div class="card">
      <p class="subtitle">Welcome back — sign in to continue</p>

      <form (submit)="$event.preventDefault(); onSubmit()" novalidate>
        <div class="field">
          <label for="login-email">Email address</label>
          <div class="input-wrap">
            <input
              (input)="email.set($event.target.value)"
              id="login-email"
              type="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
            <span class="ic" aria-hidden="true">
              <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="5" width="18" height="14" rx="2.5" />
                <path d="M3.5 7l8.5 6 8.5-6" />
              </svg>
            </span>
          </div>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <input
              (input)="password.set($event.target.value)"
              id="login-password"
              [type]="showPassword() ? 'text' : 'password'"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <span class="ic" aria-hidden="true">
              <svg
                width="17"
                height="17"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="4" y="10.5" width="16" height="10" rx="2.4" />
                <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" />
              </svg>
            </span>
            <button
              type="button"
              class="pw-toggle"
              [class.show]="showPassword()"
              [attr.aria-label]="
                showPassword() ? 'Hide password' : 'Show password'
              "
              (click)="togglePassword()"
            >
              <svg
                class="eye"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg
                class="eye-off"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M3 3l18 18M10.6 6.2A9.9 9.9 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3 3.6M6.3 7.8A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4-.85"
                />
                <path d="M9.5 10.5a3 3 0 0 0 4.2 4.2" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary">Sign in</button>

        @if (error()) {
          <p class="form-error">{{ error() }}</p>
        }
      </form>
    </div>

    <!-- Shared frame: switch link -->
    <p class="switch">
      No account yet?
      <a routerLink="/auth/register">Create one for free</a>
    </p>
  </div>
</main>
