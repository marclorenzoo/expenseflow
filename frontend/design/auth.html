<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExpenseFlow — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============ TOKENS (shared with landing) ============ */
      :root {
        --indigo: #4f46e5;
        --indigo-600: #4338ca;
        --indigo-400: #6366f1;
        --indigo-soft: #eef0ff;

        --bg: #f5f5fb;
        --bg-grad-1: #f3f2ff;
        --bg-grad-2: #f6f6fb;
        --dot: rgba(79, 70, 229, 0.1);
        --surface: #ffffff;
        --text: #14151c;
        --text-soft: #4b4f5e;
        --muted: #757a8a;
        --border: #e7e7f0;
        --border-strong: #dcdce6;
        --input-bg: #ffffff;
        --shadow-card:
          0 1px 2px rgba(20, 21, 28, 0.04), 0 18px 40px rgba(40, 32, 120, 0.1),
          0 4px 12px rgba(40, 32, 120, 0.05);
        --ring: rgba(79, 70, 229, 0.16);
        --nav-bg: rgba(255, 255, 255, 0.7);
      }
      [data-theme="dark"] {
        --indigo: #6366f1;
        --indigo-600: #4f46e5;
        --indigo-400: #818cf8;
        --indigo-soft: #1c1d33;

        --bg: #0a0b10;
        --bg-grad-1: #12111f;
        --bg-grad-2: #0a0b10;
        --dot: rgba(129, 140, 248, 0.13);
        --surface: #15161f;
        --text: #f3f4f8;
        --text-soft: #c2c5d2;
        --muted: #888da0;
        --border: #262838;
        --border-strong: #32354a;
        --input-bg: #0f1019;
        --shadow-card:
          0 1px 2px rgba(0, 0, 0, 0.4), 0 24px 60px rgba(0, 0, 0, 0.55);
        --ring: rgba(129, 140, 248, 0.25);
        --nav-bg: rgba(15, 16, 23, 0.7);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        transition:
          background-color 0.35s ease,
          color 0.35s ease;
        /* light dotted pattern over soft gradient */
        background-color: var(--bg);
        background-image:
          radial-gradient(
            circle at center,
            var(--dot) 1.4px,
            transparent 1.6px
          ),
          radial-gradient(
            820px 520px at 50% -12%,
            color-mix(in oklch, var(--indigo) 13%, transparent),
            transparent 70%
          ),
          linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2) 55%);
        background-size:
          22px 22px,
          100% 100%,
          100% 100%;
        background-position:
          0 0,
          0 0,
          0 0;
        min-height: 100%;
      }

      /* ============ THEME TOGGLE (fixed, frame-level) ============ */
      .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 20;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text-soft);
        cursor: pointer;
        display: grid;
        place-items: center;
        transition:
          color 0.2s,
          border-color 0.2s,
          transform 0.15s;
        box-shadow: 0 2px 8px rgba(20, 21, 28, 0.05);
      }
      .theme-toggle:hover {
        color: var(--indigo);
        border-color: var(--indigo);
      }
      .theme-toggle:active {
        transform: scale(0.94);
      }
      .theme-toggle .moon {
        display: none;
      }
      [data-theme="dark"] .theme-toggle .sun {
        display: none;
      }
      [data-theme="dark"] .theme-toggle .moon {
        display: block;
      }

      /* ============ LAYOUT ============ */
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
      }
      .auth {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ---- Shared frame: brand ---- */
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(150deg, var(--indigo-400), var(--indigo));
        display: grid;
        place-items: center;
        box-shadow: 0 8px 22px rgba(79, 70, 229, 0.42);
      }
      .brand .name {
        font-weight: 800;
        font-size: 26px;
        letter-spacing: -0.03em;
      }

      /* ---- Shared frame: card shell (stable) ---- */
      .card {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow-card);
        padding: 34px 32px 32px;
        transition:
          background-color 0.35s ease,
          border-color 0.35s ease,
          box-shadow 0.35s ease;
      }

      /* subtitle sits inside the morphing area */
      .subtitle {
        text-align: center;
        color: var(--text-soft);
        font-size: 15px;
        font-weight: 500;
        margin-bottom: 26px;
      }

      /* ---- Morphing content region ---- */
      .morph {
        position: relative;
        transition: height 0.34s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .panel {
        position: absolute;
        inset: 0 0 auto 0;
        width: 100%;
        transition:
          opacity 0.26s ease,
          transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0s;
      }
      /* visibility:hidden after the fade removes hidden inputs from the tab order
   and prevents the outgoing panel from overlaying the incoming one */
      .panel[aria-hidden="true"] {
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        visibility: hidden;
        transition-delay: 0s, 0s, 0.3s;
      }
      .panel[aria-hidden="false"] {
        opacity: 1;
        transform: none;
        visibility: visible;
      }
      .morph.swapping .panel[aria-hidden="true"] {
        transform: translateY(-10px);
      }

      /* ---- Form bits ---- */
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-soft);
        margin-bottom: 7px;
      }
      .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .input-wrap .ic {
        position: absolute;
        left: 13px;
        color: var(--muted);
        display: grid;
        place-items: center;
        pointer-events: none;
        transition: color 0.2s;
      }
      .field input {
        width: 100%;
        font-family: inherit;
        font-size: 15px;
        color: var(--text);
        background: var(--input-bg);
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        padding: 12px 14px 12px 40px;
        transition:
          border-color 0.18s,
          box-shadow 0.18s,
          background-color 0.35s;
      }
      .field input::placeholder {
        color: var(--muted);
        opacity: 0.8;
      }
      .field input:focus {
        outline: none;
        border-color: var(--indigo);
        box-shadow: 0 0 0 4px var(--ring);
      }
      .field input:focus + .ic,
      .input-wrap:focus-within .ic {
        color: var(--indigo);
      }
      .pw-toggle {
        position: absolute;
        right: 6px;
        width: 32px;
        height: 32px;
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: grid;
        place-items: center;
        border-radius: 8px;
        transition:
          color 0.2s,
          background-color 0.2s;
      }
      .pw-toggle:hover {
        color: var(--text);
        background: var(--indigo-soft);
      }
      .pw-toggle .eye-off {
        display: none;
      }
      .pw-toggle.show .eye {
        display: none;
      }
      .pw-toggle.show .eye-off {
        display: block;
      }

      .row-aux {
        display: flex;
        justify-content: flex-end;
        margin: -4px 0 20px;
      }
      .row-aux a {
        font-size: 13px;
        font-weight: 600;
        color: var(--indigo);
      }
      .row-aux a:hover {
        text-decoration: underline;
      }

      .btn-primary {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
        font-weight: 700;
        font-size: 15.5px;
        color: #fff;
        background: var(--indigo);
        border: none;
        border-radius: 12px;
        padding: 14px 20px;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(79, 70, 229, 0.34);
        transition:
          background-color 0.2s,
          box-shadow 0.2s,
          transform 0.12s;
      }
      .btn-primary:hover {
        background: var(--indigo-600);
        box-shadow: 0 8px 24px rgba(79, 70, 229, 0.44);
      }
      .btn-primary:active {
        transform: translateY(1px);
      }

      /* ---- Bottom link (inside frame, below card) ---- */
      .switch {
        margin-top: 24px;
        text-align: center;
        font-size: 14.5px;
        color: var(--text-soft);
        min-height: 22px;
      }
      .switch .sw-line {
        transition:
          opacity 0.24s ease,
          transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-block;
      }
      .switch.swapping .sw-line {
        opacity: 0;
        transform: translateY(6px);
      }
      .switch a {
        color: var(--indigo);
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }
      .switch a:hover {
        text-decoration: underline;
      }

      @media (prefers-reduced-motion: reduce) {
        .morph,
        .panel,
        .switch .sw-line,
        body,
        .card {
          transition: none !important;
        }
      }

      @media (max-width: 480px) {
        .card {
          padding: 28px 22px 26px;
          border-radius: 18px;
        }
        .brand .name {
          font-size: 23px;
        }
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <svg
        class="sun"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <circle cx="12" cy="12" r="4.2" />
        <path
          d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"
        />
      </svg>
      <svg
        class="moon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M20.5 14.3A8.2 8.2 0 0 1 9.7 3.5 8.2 8.2 0 1 0 20.5 14.3z" />
      </svg>
    </button>

    <main>
      <div class="auth">
        <!-- Shared frame: brand (stable across both states) -->
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
              <path
                d="M8 3v14m0 0l-3.2-3.4M8 17l3.2-3.4"
                stroke="#fff"
                stroke-width="2.1"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M16 21V7m0 0l3.2 3.4M16 7l-3.2 3.4"
                stroke="#fff"
                stroke-width="2.1"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="name">ExpenseFlow</span>
        </div>

        <!-- Shared frame: card shell (stable); only the inner content morphs -->
        <div class="card">
          <p class="subtitle" id="subtitle">
            Welcome back — sign in to continue
          </p>

          <div class="morph" id="morph">
            <!-- ===== LOGIN PANEL ===== -->
            <form class="panel" id="panel-login" aria-hidden="false" novalidate>
              <div class="field">
                <label for="login-email">Email address</label>
                <div class="input-wrap">
                  <input
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                  />
                  <span class="ic" aria-hidden="true"
                    ><svg
                      width="17"
                      height="17"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect x="3" y="5" width="18" height="14" rx="2.5" />
                      <path d="M3.5 7l8.5 6 8.5-6" /></svg
                  ></span>
                </div>
              </div>
              <div class="field">
                <label for="login-password">Password</label>
                <div class="input-wrap">
                  <input
                    type="password"
                    id="login-password"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                  />
                  <span class="ic" aria-hidden="true"
                    ><svg
                      width="17"
                      height="17"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect x="4" y="10.5" width="16" height="10" rx="2.4" />
                      <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" /></svg
                  ></span>
                  <button
                    type="button"
                    class="pw-toggle"
                    data-target="login-password"
                    aria-label="Show password"
                  >
                    <svg
                      class="eye"
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"
                      />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg
                      class="eye-off"
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M3 3l18 18M10.6 6.2A9.9 9.9 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3 3.6M6.3 7.8A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4-.85"
                      />
                      <path d="M9.5 10.5a3 3 0 0 0 4.2 4.2" />
                    </svg>
                  </button>
                </div>
              </div>
              <div class="row-aux"><a href="#">Forgot password?</a></div>
              <button type="submit" class="btn-primary">Sign in</button>
            </form>

            <!-- ===== REGISTER PANEL ===== -->
            <form
              class="panel"
              id="panel-register"
              aria-hidden="true"
              novalidate
            >
              <div class="field">
                <label for="reg-name">Full name</label>
                <div class="input-wrap">
                  <input
                    type="text"
                    id="reg-name"
                    name="name"
                    placeholder="Alex Rivera"
                    autocomplete="name"
                  />
                  <span class="ic" aria-hidden="true"
                    ><svg
                      width="17"
                      height="17"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M5 20v-1.5A4.5 4.5 0 0 1 9.5 14h5a4.5 4.5 0 0 1 4.5 4.5V20"
                      />
                      <circle cx="12" cy="8" r="3.6" /></svg
                  ></span>
                </div>
              </div>
              <div class="field">
                <label for="reg-email">Email address</label>
                <div class="input-wrap">
                  <input
                    type="email"
                    id="reg-email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                  />
                  <span class="ic" aria-hidden="true"
                    ><svg
                      width="17"
                      height="17"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect x="3" y="5" width="18" height="14" rx="2.5" />
                      <path d="M3.5 7l8.5 6 8.5-6" /></svg
                  ></span>
                </div>
              </div>
              <div class="field">
                <label for="reg-password">Password</label>
                <div class="input-wrap">
                  <input
                    type="password"
                    id="reg-password"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="new-password"
                  />
                  <span class="ic" aria-hidden="true"
                    ><svg
                      width="17"
                      height="17"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect x="4" y="10.5" width="16" height="10" rx="2.4" />
                      <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" /></svg
                  ></span>
                  <button
                    type="button"
                    class="pw-toggle"
                    data-target="reg-password"
                    aria-label="Show password"
                  >
                    <svg
                      class="eye"
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"
                      />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg
                      class="eye-off"
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M3 3l18 18M10.6 6.2A9.9 9.9 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3 3.6M6.3 7.8A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4-.85"
                      />
                      <path d="M9.5 10.5a3 3 0 0 0 4.2 4.2" />
                    </svg>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn-primary">Create account</button>
            </form>
          </div>
        </div>

        <!-- Shared frame: switch link (content swaps with state) -->
        <p class="switch" id="switch">
          <span class="sw-line" id="switchLine"
            >No account yet?
            <a id="switchLink" role="button" tabindex="0"
              >Create one for free</a
            ></span
          >
        </p>
      </div>
    </main>

    <script>
      (function () {
        var root = document.documentElement;

        /* ---- Theme ---- */
        var stored = null;
        try {
          stored = localStorage.getItem("ef-theme");
        } catch (e) {}
        if (stored) root.setAttribute("data-theme", stored);
        else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        )
          root.setAttribute("data-theme", "dark");
        document
          .getElementById("themeToggle")
          .addEventListener("click", function () {
            var next =
              root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            try {
              localStorage.setItem("ef-theme", next);
            } catch (e) {}
          });

        /* ---- Password reveal ---- */
        document.querySelectorAll(".pw-toggle").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var inp = document.getElementById(btn.getAttribute("data-target"));
            var show = inp.type === "password";
            inp.type = show ? "text" : "password";
            btn.classList.toggle("show", show);
            btn.setAttribute(
              "aria-label",
              show ? "Hide password" : "Show password",
            );
          });
        });

        /* ---- Morph between login / register ---- */
        var morph = document.getElementById("morph");
        var subtitle = document.getElementById("subtitle");
        var switchEl = document.getElementById("switch");
        var switchLine = document.getElementById("switchLine");
        var panels = {
          login: document.getElementById("panel-login"),
          register: document.getElementById("panel-register"),
        };
        var copy = {
          login: {
            title: "Sign in",
            subtitle: "Welcome back — sign in to continue",
            switch:
              'No account yet? <a id="switchLink" role="button" tabindex="0">Create one for free</a>',
          },
          register: {
            title: "Sign up",
            subtitle: "Create your account and start tracking",
            switch:
              'Already have an account? <a id="switchLink" role="button" tabindex="0">Sign in</a>',
          },
        };

        var state = "login";
        var animating = false;

        function setHeight() {
          morph.style.height = panels[state].offsetHeight + "px";
        }
        // init height (after fonts settle)
        function initHeight() {
          setHeight();
        }
        if (document.fonts && document.fonts.ready)
          document.fonts.ready.then(initHeight);
        window.addEventListener("load", initHeight);
        window.addEventListener("resize", setHeight);
        initHeight();

        function wireSwitch() {
          var link = document.getElementById("switchLink");
          if (!link) return;
          link.addEventListener("click", go);
          link.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              go();
            }
          });
        }
        wireSwitch();

        function go() {
          if (animating) return;
          animating = true;
          var next = state === "login" ? "register" : "login";
          var cur = panels[state],
            nxt = panels[next];

          // crossfade panels + morph height
          morph.classList.add("swapping");
          cur.setAttribute("aria-hidden", "true");
          nxt.setAttribute("aria-hidden", "false");
          morph.style.height = nxt.offsetHeight + "px";

          // swap subtitle + switch line text with a quick fade
          subtitle.style.transition = "opacity .2s ease";
          subtitle.style.opacity = "0";
          switchEl.classList.add("swapping");

          setTimeout(function () {
            subtitle.textContent = copy[next].subtitle;
            subtitle.style.opacity = "1";
            switchLine.innerHTML = copy[next].switch;
            wireSwitch();
            switchEl.classList.remove("swapping");
          }, 200);

          // update title + url-ish state
          document.title = "ExpenseFlow — " + copy[next].title;

          setTimeout(function () {
            morph.classList.remove("swapping");
            state = next;
            animating = false;
            setHeight();
            // focus first field of the new panel for keyboard users (no scroll jump)
            var first = nxt.querySelector("input");
            if (
              first &&
              document.activeElement &&
              document.activeElement.id === "switchLink"
            )
              first.focus({ preventScroll: true });
          }, 340);
        }
      })();
    </script>
  </body>
</html>
